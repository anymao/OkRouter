import com.anymore.okrouter.OkRouterTransformPlugin

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'auto-service'
//    id 'okrouter'
}

apply plugin: OkRouterTransformPlugin

android {
    namespace 'com.anymore.okrouter.demo.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.anymore.okrouter.demo.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

okRouter {
    createOkRouterDoc = true
    okRouterDocFile = project.file("路由文档.md").canonicalPath
}

dependencies {
    api project(":demo-base")
    api project(":demo-biz1")
    api project(":demo-biz2")
    api project(":demo-web")
    api project(":demo-login")

    androidTestImplementation "androidx.test:core:1.5.0"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}

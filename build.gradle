// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "2.1.0"
    def mavenUsername = findProperty("maven_username") ?: System.getenv("ALIYUN_USERNAME")
    def mavenPassword = findProperty("maven_password") ?: System.getenv("ALIYUN_PASSWORD")
    def releasesRepoUrl = findProperty("maven_release_url") ?: System.getenv("MAVEN_RELEASE_URL") ?: "https://packages.aliyun.com/maven/repository/2202395-release-jr0puW/"
    def snapshotsRepoUrl = findProperty("maven_snapshot_url") ?: System.getenv("MAVEN_SNAPSHOT_URL") ?: "https://packages.aliyun.com/maven/repository/2202395-snapshot-3OoSzj/"
    repositories {
        google()
        mavenCentral()
        maven {
            credentials {
                username mavenUsername
                password mavenPassword
            }
            url releasesRepoUrl
        }
        maven {
            credentials {
                username mavenUsername
                password mavenPassword
            }
            url snapshotsRepoUrl
        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath("com.anymore:auto-service-register:0.0.8")
//        classpath("com.anymore:okrouter-plugin:0.0.1-SNAPSHOT")
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }

    configurations.all {

        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
    }
}

allprojects {
    def mavenUsername = findProperty("maven_username") ?: System.getenv("ALIYUN_USERNAME")
    def mavenPassword = findProperty("maven_password") ?: System.getenv("ALIYUN_PASSWORD")
    def releasesRepoUrl = findProperty("maven_release_url") ?: System.getenv("MAVEN_RELEASE_URL") ?: "https://packages.aliyun.com/maven/repository/2202395-release-jr0puW/"
    def snapshotsRepoUrl = findProperty("maven_snapshot_url") ?: System.getenv("MAVEN_SNAPSHOT_URL") ?: "https://packages.aliyun.com/maven/repository/2202395-snapshot-3OoSzj/"
    repositories {
        google()
        mavenCentral()
        maven {
            credentials {
                username mavenUsername
                password mavenPassword
            }
            url releasesRepoUrl
        }
        maven {
            credentials {
                username mavenUsername
                password mavenPassword
            }
            url snapshotsRepoUrl
        }
        maven { url "https://jitpack.io" }

    }
    configurations.all {

        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
